
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Database - CRUD Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎬 Movies Database</h1>
        <p>MongoDB Atlas CRUD Operations</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Add / Update Movie</h2>

            <form id="movieForm">
                <input type="hidden" id="movieId">

                <label>Movie Title</label>
                <input type="text" id="title" placeholder="Enter movie title" required>

                <label>Director</label>
                <input type="text" id="director" placeholder="Enter director name" required>

                <label>Release Year</label>
                <input type="number" id="year" placeholder="Enter release year" required>

                <label>Genre</label>
                <input type="text" id="genre" placeholder="Enter genre" required>

                <button type="submit" id="submitBtn">Add Movie</button>
                <button type="button" id="cancelBtn" hidden>Cancel Edit</button>
            </form>
        </section>

        <section class="movies-section">
            <h2>Movies Collection</h2>
            <p id="message"></p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Director</th>
                            <th>Year</th>
                            <th>Genre</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="moviesList">
                        <tr>
                            <td colspan="5">Loading movies...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
